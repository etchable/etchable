name: deploy-web

# Deploys the website to Cloudflare on every push to main that touches it.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy-web:
    name: Deploy Website
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Record a D1 time-travel restore point before migrations touch prod.
      # If a migration goes wrong, restore with:
      #   npx wrangler d1 time-travel restore etchable-web --bookmark=<bookmark from this step's log>
      # Bookmarks are opaque handles (no data, safe in public logs) and are
      # restorable for 30 days.
      - name: Record pre-migration D1 restore point
        run: npx wrangler d1 time-travel info etchable-web
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations
        run: pnpm --filter @etchable/web db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # worker-configuration.d.ts is gitignored; generate it so tsc can see
      # Env. The example vars file stands in for .dev.vars so secret names
      # get typed without real values.
      - name: Generate wrangler types
        run: |
          cp .dev.vars.example .dev.vars
          pnpm run cf-typegen
        working-directory: apps/web

      - name: Build & deploy
        run: pnpm --filter @etchable/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
