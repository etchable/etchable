name: ci

# Desktop-app checks: Rust workspace tests, frontend typecheck/build, and the
# circuit-json emitter validated against the published tscircuit schemas.
on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/web/**"
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "apps/web/**"
      - "docs/**"
      - "**.md"

jobs:
  desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Vendor the Zener stdlib
        run: ./scripts/fetch-stdlib.sh

      - name: Rust tests
        run: cargo test --workspace
        env:
          # Tests must never touch LCSC/EasyEDA; fixtures are the wire truth.
          ETCHABLE_LCSC_OFFLINE: "1"

      - name: Frontend typecheck + build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @etchable/desktop build

      - name: Validate circuit-json emission against published schemas
        run: |
          cargo run -q -p zen-build -- examples/demo/board.zen --circuit-json --offline \
            | pnpm run --silent validate:circuit-json

      - name: Symbol geometry table matches schematic-symbols pin
        run: pnpm --filter @etchable/desktop gen:symbol-geom:check

      - name: Store types are in sync (ts-rs)
        run: pnpm --filter @etchable/desktop gen:store-types:check
