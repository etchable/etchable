[package]
name = "zen-build"
version.workspace = true
edition.workspace = true
description = "Eval pipeline for .zen files: resolve -> eval -> checks -> schematic -> ERC. The only crate allowed to depend on pcb-* internals."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

pcb-zen-core.workspace = true
pcb-sch.workspace = true
pcb-eda.workspace = true
pcb-component-gen.workspace = true
tracing.workspace = true
# Must match the exact fork+rev used by the pcb workspace so types line up.
starlark = { git = "https://github.com/diodeinc/starlark-rust", rev = "c3d776bcd0bf074b00fc059d7700b82ab8dcc010", default-features = false }

clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
toml = "0.9"
# Pure-Rust `git init` for scaffolded projects: no PATH lookup, no git binary.
gix = { version = "0.85", default-features = false, features = ["sha1"] }

[[bin]]
name = "zen-build"
path = "src/bin/zen_build.rs"
