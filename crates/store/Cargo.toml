[package]
name = "store"
version.workspace = true
edition.workspace = true
description = "The ~/.etchable/ local storage layer: canonical paths (cache/state/runtime) and the sea-orm/sqlite app state (recents, agent sessions, prefs) with embedded migrations."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

# sea-orm rides sqlx-sqlite, whose bundled libsqlite3-sys owns the one
# links="sqlite3" slot — possible only because zen-build's dep-less frozen
# resolver dropped pcb-zen (and its rusqlite). See docs/decisions/0005.
sea-orm = { version = "2.0.1", default-features = false, features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
  "macros",
] }
sea-orm-migration = { version = "2.0.1", default-features = false, features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
] }
dirs = "6"
# Exact pin: generated TS must be byte-stable for the CI check.
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }

[dev-dependencies]
tempfile = "3"
