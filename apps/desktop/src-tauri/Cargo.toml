[package]
name = "etchable"
version.workspace = true
edition = "2021"
description = "Etchable: infinite-canvas .zen schematic viewer with an embedded Claude Code session"
authors = ["Left Shift Logical, LLC"]
license.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows.
name = "etchable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zen-build = { path = "../../../crates/zen-build" }
store = { path = "../../../crates/store" }
agent-proto = { path = "../../../crates/agent-proto" }
agent-host = { path = "../../../crates/agent-host" }
mcp = { path = "../../../crates/mcp" }

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
notify = "8"
